        run: |
          set -euo pipefail
          if [ -z "${ANON_KEY}" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY absent."
            exit 1
          fi
          echo "Longueur de la clé : ${#ANON_KEY}"
          echo "Préfixe : ${ANON_KEY:0:6}"

          # Les clés sb_publishable_ ne doivent PAS partir en Authorization: Bearer
          if [ "${ANON_KEY:0:3}" = "eyJ" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${ANON_KEY}")
          else
            AUTH_ARGS=()
          fi

          for attempt in 1 2 3; do
            echo "Tentative ${attempt}/3..."
            HTTP_CODE=$(curl -sS -o response.txt -w '%{http_code}' \
              --max-time 20 \
              "${SUPABASE_URL}/rest/v1/keepalive?select=id&limit=1" \
              -H "apikey: ${ANON_KEY}" \
              "${AUTH_ARGS[@]}" \
              -H "Accept: application/json" || echo "000")
            echo "Code HTTP : ${HTTP_CODE} — $(cat response.txt)"
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "✅ Ping réussi."
              exit 0
            fi
            [ "${attempt}" -lt 3 ] && sleep 30
          done
          echo "::error::Ping échoué (code ${HTTP_CODE})."
          exit 1
