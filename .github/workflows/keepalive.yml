name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://yrxrsiekwsefrjadbmgv.supabase.co
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANON_KEY}" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY absent."
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Tentative ${attempt}/3..."
            HTTP_CODE=$(curl -sS -o response.txt -w '%{http_code}' \
              --max-time 20 \
              "${SUPABASE_URL}/rest/v1/keepalive?select=id&limit=1" \
              -H "apikey: ${ANON_KEY}" \
              -H "Authorization: Bearer ${ANON_KEY}" \
              -H "Accept: application/json" || echo "000")
            echo "Code HTTP : ${HTTP_CODE} — $(cat response.txt)"
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "✅ Ping réussi."
              exit 0
            fi
            [ "${attempt}" -lt 3 ] && sleep 30
          done
          echo "::error::Ping échoué après 3 tentatives (code ${HTTP_CODE})."
          exit 1
