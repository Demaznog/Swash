<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#1598ba"><title>TIDE</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"><style>
:root{--ink:#173b40;--ink2:#0d4660;--corail:#E05638;--sable:#F8D8AB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--sable)}
body{margin:0;padding:0;min-height:100svh;color:var(--ink);background:var(--sable);
 font-family:"Nunito",ui-rounded,-apple-system-rounded,"SF Pro Rounded",-apple-system,sans-serif}
#mer{position:absolute;left:0;right:0;top:0;height:clamp(178px,21svh,222px);z-index:0;pointer-events:none;
 background:linear-gradient(180deg,#1598ba 0,#3fbacf 42%,#9ed8cf 70%,#e4d9bd 88%,var(--sable) 100%)}
#mer:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,
 rgba(255,255,255,0) 0,rgba(255,255,255,.12) 48%,rgba(255,255,255,.46) 80%,rgba(255,255,255,.72) 95%,rgba(255,255,255,0) 100%)}
.page{position:relative;z-index:1;max-width:470px;margin:0 auto;
 padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 22px)}
.brand{text-align:center}
.brand b{display:inline-block;font-size:clamp(50px,13vw,88px);font-weight:900;letter-spacing:.085em;
 line-height:.92;color:var(--ink2);animation:flotte 6s ease-in-out infinite}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.punch{margin-top:4px;text-align:center;font-size:clamp(17px,4.8vw,21px);font-weight:900;color:var(--ink2)}
.punch em{display:block;font-style:normal;margin-top:3px;font-size:.62em;font-weight:800;color:var(--corail)}
.duo{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.carte{border:0;padding:0;background:none;color:var(--ink);display:grid;justify-items:center;gap:6px;
 transition:transform .34s cubic-bezier(.2,1.3,.4,1),opacity .28s;opacity:.5;transform:scale(.92)}
.carte[aria-pressed="true"]{opacity:1;transform:scale(1.04)}
.plateau{position:relative;width:100%;aspect-ratio:1;background-size:100% 100%;background-repeat:no-repeat}
.plateau .p{position:absolute;transform:translate(-50%,-50%);width:var(--d);aspect-ratio:1;
 background-size:100% 100%;background-repeat:no-repeat;filter:drop-shadow(0 2px 3px rgba(120,80,40,.34));
 transition:left .6s cubic-bezier(.34,1.25,.42,1),top .6s cubic-bezier(.34,1.25,.42,1)}
.plateau .halo{position:absolute;transform:translate(-50%,-50%);width:var(--d);aspect-ratio:1;
 border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.7);
 opacity:0;transition:opacity .35s}
.plateau.gagne .halo{opacity:1}
.etiq{display:grid;justify-items:center;gap:1px}
.nom{font-size:clamp(15px,4.2vw,17px);font-weight:900;letter-spacing:.01em;line-height:1.1;margin-top:2px}
.meta{font-size:9.5px;font-weight:900;letter-spacing:.03em;color:var(--ink2);opacity:.55;white-space:nowrap}
.lab{margin-top:18px;text-align:center;font-size:10px;font-weight:900;letter-spacing:.17em;
 text-transform:uppercase;color:var(--ink2);opacity:.5}
.modes{margin-top:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mode{min-height:72px;border:0;border-radius:17px;font-family:inherit;padding:8px 4px;
 background:#F3D4A4;color:var(--ink);display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:3px;font-weight:900;font-size:15px;transition:transform .16s}
.mode small{font-size:9.5px;font-weight:750;opacity:.58;text-align:center;line-height:1.2}
.mode:active{transform:scale(.96)}
.mode.p{background:linear-gradient(180deg,#184a55,#113741);color:#fff;
 box-shadow:0 8px 20px rgba(20,58,63,.22)}
.mode.p small{opacity:.72}
.pied{margin-top:14px;text-align:center}
.pied button{border:0;background:none;color:var(--ink);opacity:.6;font-weight:850;font-size:13px;
 font-family:inherit;text-decoration:underline;text-underline-offset:4px}
.pied p{margin:9px 0 0;font-size:9px;font-weight:900;letter-spacing:.19em;opacity:.38}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
