/* ---------- bandeau mer ---------- */
.mer{position:relative;height:clamp(150px,29svh,250px);overflow:hidden}
.mer img{width:100%;height:100%;object-fit:cover;object-position:50% 88%;display:block}
.mer:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:26px;
  background:linear-gradient(180deg,rgba(249,215,167,0),var(--sable-fond))}
.menu{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:16px;
  width:44px;height:44px;border:0;border-radius:50%;padding:0;background:none;color:var(--navy);
  filter:drop-shadow(0 4px 10px rgba(8,44,80,.35))}
.menu svg{width:44px;height:44px;display:block}

/* ---------- identite ---------- */

.marque img{width:min(62vw,232px);height:auto;display:block;margin:0 auto}
.tag{margin-top:12px;font-size:14px;font-weight:700;letter-spacing:.01em;color:var(--bleu-sombre);opacity:.9}

<script>
const $=id=>document.getElementById(id);
const trous=(el,n)=>{el.innerHTML="";for(let i=0;i<n*n;i++)el.appendChild(document.createElement("i"))};
trous($("g4"),4); trous($("g5"),5);

let jeu = localStorage.getItem("tide_jeu")==="plus" ? "plus" : "classic";
function peindre(){
  $("cClassic").setAttribute("aria-pressed", jeu==="classic");
  $("cPlus").setAttribute("aria-pressed", jeu==="plus");
}
function choisir(j){ jeu=j; try{localStorage.setItem("tide_jeu",j)}catch(e){} peindre(); }
$("cClassic").onclick=()=>choisir("classic");
$("cPlus").onclick=()=>choisir("plus");
peindre();

const aller=(m)=>{ location.href = (jeu==="plus"?"plus.html":"classic.html") + "?m=" + m; };
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>aller(b.dataset.m));
$("btnReglement").onclick=()=>aller("regles");
$("btnMenu").onclick=()=>aller("regles");
</script>
