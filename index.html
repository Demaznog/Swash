<title>TIDE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif;background:#0e526d}
#hub{
  position:fixed;z-index:20;left:0;right:0;top:0;
  padding:calc(env(safe-area-inset-top) + 6px) 10px 7px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(8,55,74,.94);backdrop-filter:blur(14px);
  box-shadow:0 4px 18px rgba(0,0,0,.16)
}
.logo{color:#fff;font-weight:950;letter-spacing:.12em;margin-right:7px;font-size:15px}
.tab{
  appearance:none;border:1px solid rgba(255,255,255,.18);border-radius:13px;
  padding:9px 14px;background:rgba(255,255,255,.10);color:rgba(255,255,255,.78);
  font-weight:900;font-size:13px
}
.tab.active{background:#fff;color:#0e526d}
.badge{font-size:.72em;vertical-align:super;margin-left:2px}
#frame{
  position:fixed;left:0;right:0;bottom:0;
  top:calc(env(safe-area-inset-top) + 50px);
  width:100%;height:calc(100% - env(safe-area-inset-top) - 50px);
  border:0;background:#efc77c
}
@media(max-width:430px){
  .logo{font-size:13px;margin-right:2px}
  .tab{padding:9px 11px;font-size:12px}
}
</style>
</head>

const frame=document.getElementById("frame");
const classicTab=document.getElementById("classicTab");
const plusTab=document.getElementById("plusTab");

function decode64(s){
  const bin=atob(s);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function openGame(which){
  const isClassic=which==="classic";
  classicTab.classList.toggle("active",isClassic);
  plusTab.classList.toggle("active",!isClassic);
  frame.title=isClassic?"TIDE Classic":"TIDE+";
  frame.srcdoc=decode64(APPS[which]);
  localStorage.setItem("tide_last_game",which);
}
classicTab.onclick=()=>openGame("classic");
plusTab.onclick=()=>openGame("plus");
openGame(localStorage.getItem("tide_last_game")==="plus"?"plus":"classic");
</script>
