<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#1598ba"><title>Swash</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"><style>
:root{--ink:#173b40;--ink2:#0d4660;--corail:#E05638;--sable:#F8D8AB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#F8D8AB}
body{margin:0;padding:0;min-height:100svh;color:var(--ink);background:#F8D8AB;
 font-family:"Nunito",ui-rounded,-apple-system-rounded,"SF Pro Rounded",-apple-system,sans-serif}
#mer{position:absolute;left:0;right:0;top:0;
 height:calc(env(safe-area-inset-top) + clamp(170px,20svh,208px));z-index:0;pointer-events:none;
 background:linear-gradient(180deg,#1598ba 0,#3fbacf 42%,#9ed8cf 70%,#e4d9bd 88%,var(--sable) 100%)}
#mer:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,
 rgba(255,255,255,0) 0,rgba(255,255,255,.12) 48%,rgba(255,255,255,.46) 80%,rgba(255,255,255,.72) 95%,rgba(255,255,255,0) 100%)}
.page{position:relative;z-index:1;max-width:470px;margin:0 auto;min-height:100svh;
 display:flex;flex-direction:column;
 padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.entete{height:clamp(162px,18svh,192px);display:flex;flex-direction:column;justify-content:center}
.duo{flex:0 0 auto}
.bas{margin-top:38px;padding-top:0}
.duo{margin-bottom:0}
.brand{text-align:center}
.brand .mot{display:inline-block;font-family:"Nunito",sans-serif;font-size:clamp(50px,13vw,88px);
 font-weight:900;font-synthesis-weight:none;letter-spacing:.085em;
 line-height:.92;color:var(--ink2);animation:flotte 6s ease-in-out infinite}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.slogan{margin-top:2px;text-align:center;font-size:clamp(10px,2.9vw,12px);font-weight:800;
 letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);opacity:.62}
.objectif{margin:16px auto 2px;display:table;padding:9px 20px;border-radius:999px;
 background:rgba(255,255,255,.42);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 1px 0 rgba(255,255,255,.35);
 text-align:center;font-size:clamp(14px,4vw,17px);font-weight:900;color:var(--ink2);
 letter-spacing:.01em}
.objectif b{color:var(--ink2)}
.duo{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.carte{border:0;padding:0;background:none;color:var(--ink);display:grid;justify-items:center;gap:6px;
 align-content:start;transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
.carte .plateau .p{transition:left .6s cubic-bezier(.34,1.25,.42,1),top .6s cubic-bezier(.34,1.25,.42,1),
 filter .3s,opacity .3s}
.carte[aria-pressed="false"] .plateau .p{filter:saturate(.82)
 drop-shadow(0 1px 2px rgba(120,80,40,.24))}
.carte[aria-pressed="false"] .nom,.carte[aria-pressed="false"] .meta{opacity:.7}
.carte[aria-pressed="true"]{transform:translateY(-5px) scale(1.04)}
.carte[aria-pressed="true"] .plateau{filter:drop-shadow(0 9px 14px rgba(158,114,58,.34))}
.carte[aria-pressed="true"] .nom{opacity:1}
.carte[aria-pressed="false"]{opacity:.6}
.carte[aria-pressed="true"] .nom{color:var(--ink2)}
.plateau{position:relative;width:100%;aspect-ratio:1;background-size:100% 100%;background-repeat:no-repeat}
.plateau .p{position:absolute;transform:translate(-50%,-50%);width:var(--d);aspect-ratio:1;
 background-size:100% 100%;background-repeat:no-repeat;filter:drop-shadow(0 2px 3px rgba(120,80,40,.34));
 transition:left .6s cubic-bezier(.34,1.25,.42,1),top .6s cubic-bezier(.34,1.25,.42,1)}
.plateau .halo{position:absolute;transform:translate(-50%,-50%);width:var(--d);aspect-ratio:1;
 border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.7);
 opacity:0;transition:opacity .35s}
.plateau.gagne .halo{opacity:1}
.etiq{display:grid;justify-items:center;gap:7px;padding-top:6px}
.nom{font-family:"Nunito",sans-serif;font-size:clamp(15px,4.5vw,20px);font-weight:900;
 font-synthesis-weight:none;letter-spacing:.085em;line-height:.92;
 text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.nom .p{color:var(--corail);font-size:.56em;vertical-align:super;letter-spacing:.06em;margin-left:.1em}
.meta{font-size:8.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
 color:#7d5a2e;background:rgba(196,152,101,.24);padding:4px 9px;border-radius:999px;line-height:1}
.lab{margin-top:0;text-align:center;font-size:10px;font-weight:900;letter-spacing:.17em;
 text-transform:uppercase;color:var(--ink2);opacity:.5}
.modes{margin-top:9px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mode{min-width:0;min-height:70px;border:0;border-radius:17px;font-family:inherit;padding:8px 3px;
 background:rgba(255,255,255,.40);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
 color:var(--ink2);display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:2px;font-weight:900;transition:transform .16s;
 font-size:clamp(12px,3.7vw,15px);white-space:nowrap;overflow:hidden}
.mode small{font-size:clamp(8px,2.5vw,10px);font-weight:750;opacity:.58;text-align:center;
 line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mode:active{transform:scale(.96)}
.mode.p{background:linear-gradient(180deg,#184a55,#113741);color:#fff;
 box-shadow:0 8px 20px rgba(20,58,63,.22)}
.mode.p small{opacity:.72}
.pied{margin-top:14px;text-align:center}
.pied button{border:0;background:none;color:var(--ink);opacity:.6;font-weight:850;font-size:13px;
 font-family:inherit;text-decoration:underline;text-underline-offset:4px}
.pied p{margin:9px 0 0;font-size:9px;font-weight:900;letter-spacing:.19em;opacity:.38}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mode{text-decoration:none;cursor:pointer}
.pied a#reg{display:inline-block;color:var(--ink);opacity:.6;font-weight:850;font-size:13px;
 text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;cursor:pointer}
.pied a#reg:visited,.pied a#reg:active{color:var(--ink)}
.carte{cursor:pointer}

function poser(id,cle,pieces){
  const el=document.getElementById(id), b=B[cle];
  el.style.setProperty("--d", b.d+"%"); el.innerHTML="";
  const n=[];
  pieces.forEach(p=>{const e=document.createElement("div");e.className="p";
    e.style.backgroundImage="url("+P[p.img]+")";
    e.style.left=b.cols[p.c]+"%"; e.style.top=b.rows[p.r]+"%"; el.appendChild(e); n.push(e);});
  return {b,n,el};
}
const C=poser("b4","board-4x4",[{r:0,c:0,img:"pb"},{r:1,c:1,img:"pb"},{r:2,c:2,img:"pb"},
  {r:3,c:1,img:"pb"},
  {r:0,c:3,img:"pr"},{r:2,c:0,img:"pr"},{r:3,c:3,img:"pr"},{r:1,c:3,img:"pr"}]);
const h=document.createElement("div"); h.className="halo";
h.style.left=C.b.cols[3]+"%"; h.style.top=C.b.rows[3]+"%"; C.el.appendChild(h);
let t=0;
setInterval(()=>{
  t=(t+1)%2;
  if(t){ C.n[6].style.left=C.b.cols[2]+"%"; C.n[6].style.top=C.b.rows[3]+"%";
         C.n[3].style.left=C.b.cols[3]+"%"; C.n[3].style.top=C.b.rows[3]+"%";
         setTimeout(()=>C.el.classList.add("gagne"),560); }
  else { C.el.classList.remove("gagne");
         C.n[3].style.left=C.b.cols[1]+"%"; C.n[3].style.top=C.b.rows[3]+"%";
         C.n[6].style.left=C.b.cols[3]+"%"; C.n[6].style.top=C.b.rows[3]+"%"; }
},2800);
const T=poser("b5","board-5x5",[
  {r:2,c:2,img:"lb"},{r:2,c:3,img:"pb"},{r:3,c:1,img:"pb"},{r:1,c:4,img:"pb"},{r:0,c:1,img:"pb"},
  {r:1,c:1,img:"lr"},{r:3,c:3,img:"pr"},{r:4,c:2,img:"pr"},{r:0,c:3,img:"pr"},{r:4,c:4,img:"pr"}]);
let u=0;
setInterval(()=>{u=(u+1)%2; const p=T.n[1];
  p.style.left=T.b.cols[u?1:2]+"%"; p.style.top=T.b.rows[u?1:2]+"%";},3200);
