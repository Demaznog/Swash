<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#1598ba"><title>TIDE</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--ink:#173b40;--ink2:#0d4660;--pill:#0e4b68;--corail:#E05638;
 --glass:rgba(255,255,255,.56);--glass-b:rgba(255,255,255,.30)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#ecc276}
body{margin:0;min-height:100svh;color:var(--ink);
 font-family:"Nunito",ui-rounded,-apple-system-rounded,"SF Pro Rounded",
   -apple-system,BlinkMacSystemFont,sans-serif;
 background:#F8D8AB;
 padding:0}
#mer{position:absolute;left:0;right:0;top:0;height:clamp(230px,26svh,290px);z-index:0;pointer-events:none;
 background:linear-gradient(180deg,#1598ba 0,#43bcd0 44%,#a8dcd2 72%,#e8dcbb 90%,#F8D8AB 100%)}
#mer:after{content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(255,255,255,0) 0,rgba(255,255,255,.14) 46%,
  rgba(255,255,255,.52) 78%,rgba(255,255,255,.80) 94%,rgba(255,255,255,0) 100%)}
.page{position:relative;z-index:1;max-width:480px;margin:0 auto;
 padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 26px)}

.brand{text-align:center;padding-top:2px}
.brand b{display:inline-block;font-size:clamp(52px,13.5vw,92px);font-weight:900;
 letter-spacing:.085em;line-height:.9;color:var(--ink2);
 animation:flotte 5.5s ease-in-out infinite}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.punch{margin-top:8px;font-size:clamp(18px,5vw,23px);font-weight:900;text-align:center;color:var(--ink2)}
.punch em{display:block;font-style:normal;margin-top:5px;font-size:.60em;font-weight:800;color:var(--corail)}

.duo{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.carte{border:0;padding:0;background:none;color:var(--ink);
 display:grid;justify-items:center;gap:10px;
 transition:transform .34s cubic-bezier(.2,1.3,.4,1),opacity .25s,filter .25s;
 opacity:.55;transform:scale(.93);filter:saturate(.85)}
.carte[aria-pressed="true"]{opacity:1;transform:scale(1.03);filter:none}
.plateau{position:relative;width:100%;aspect-ratio:1;border-radius:12px;
 filter:drop-shadow(0 6px 12px rgba(168,120,62,.22));
 background-size:100% 100%;background-repeat:no-repeat}
.plateau .p{position:absolute;transform:translate(-50%,-50%);width:var(--d);height:var(--d);
 background-size:100% 100%;background-repeat:no-repeat;transition:left .55s cubic-bezier(.35,1.2,.4,1),top .55s cubic-bezier(.35,1.2,.4,1)}
.plateau .halo{position:absolute;transform:translate(-50%,-50%);width:var(--d);height:var(--d);
 border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.92);opacity:0;transition:opacity .3s}
.plateau.gagne .halo{opacity:1}
.etiq{display:grid;justify-items:center;gap:1px;padding:2px 4px 0}
.nom{font-size:clamp(14px,4.2vw,17px);font-weight:900;letter-spacing:.03em;line-height:1}
.meta{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);opacity:.55}

.modes{margin-top:20px;display:grid;gap:9px}
.mode{width:100%;border:0;border-radius:18px;padding:15px 18px;text-align:left;
 background:rgba(243,212,164,.80);border:1px solid rgba(198,154,98,.42);color:var(--ink);
 display:flex;align-items:baseline;justify-content:space-between;gap:10px;
 font-weight:800;font-size:16px;transition:transform .18s}
.mode small{font-size:11px;font-weight:750;opacity:.58}
.mode:active{transform:scale(.975)}
.mode.p{background:linear-gradient(180deg,#184a55,#113741);color:#fff;border:0;
 box-shadow:0 8px 22px rgba(20,58,63,.24)}
.mode.p small{opacity:.72}
.pied{margin-top:18px;text-align:center}
.pied button{border:0;background:none;color:var(--ink);opacity:.62;font-weight:850;font-size:13.5px;
 text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;font-family:inherit}
.pied p{margin:12px 0 0;font-size:9.5px;font-weight:900;letter-spacing:.19em;opacity:.42}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function poser(el,cle,pieces){
  const g=G[cle], d=g.piece_diam_pct;
  el.style.setProperty("--d", d+"%");
  el.innerHTML="";
  const noeuds={};
  pieces.forEach((p,i)=>{
    const e=document.createElement("div"); e.className="p"; e.dataset.k=i;
    e.style.backgroundImage="url("+A[p.img]+")";
    e.style.left=g.cols_pct[p.c]+"%"; e.style.top=g.rows_pct[p.r]+"%";
    el.appendChild(e); noeuds[i]=e;
  });
  return {g,noeuds};
}
// Classic : trois bleus alignes, le quatrieme glisse pour completer
const cls=[{r:0,c:0,img:"pb"},{r:1,c:1,img:"pb"},{r:2,c:2,img:"pb"},
           {r:3,c:1,img:"pb"},{r:0,c:3,img:"pr"},{r:2,c:0,img:"pr"},{r:3,c:3,img:"pr"}];
const B4=poser(document.getElementById("b4"),"board-4x4",cls);
const halo=document.createElement("div"); halo.className="halo";
halo.style.left=B4.g.cols_pct[3]+"%"; halo.style.top=B4.g.rows_pct[3]+"%";
document.getElementById("b4").appendChild(halo);
let phase=0;
setInterval(()=>{
  const mob=B4.noeuds[3], plateau=document.getElementById("b4");
  phase=(phase+1)%2;
  if(phase===1){ // il glisse en 3,3 : alignement complet
    B4.noeuds[6].style.left=B4.g.cols_pct[2]+"%"; B4.noeuds[6].style.top=B4.g.rows_pct[3]+"%";
    mob.style.left=B4.g.cols_pct[3]+"%"; mob.style.top=B4.g.rows_pct[3]+"%";
    setTimeout(()=>plateau.classList.add("gagne"),520);
  }else{
    plateau.classList.remove("gagne");
    mob.style.left=B4.g.cols_pct[1]+"%"; mob.style.top=B4.g.rows_pct[3]+"%";
    B4.noeuds[6].style.left=B4.g.cols_pct[3]+"%"; B4.noeuds[6].style.top=B4.g.rows_pct[3]+"%";
  }
},2600);
// TIDE+ : la Perle se deplace en diagonale
const plus=[{r:1,c:1,img:"pr"},{r:2,c:2,img:"lb"},{r:2,c:3,img:"pb"},{r:3,c:1,img:"pb"},
            {r:3,c:3,img:"pr"},{r:4,c:2,img:"pr"},{r:1,c:4,img:"pb"}];
const B5=poser(document.getElementById("b5"),"board-5x5",plus);
let d2=0;
setInterval(()=>{
  d2=(d2+1)%2; const p=B5.noeuds[1];
  p.style.left=B5.g.cols_pct[d2?1:2]+"%"; p.style.top=B5.g.rows_pct[d2?1:2]+"%";
},3100);

let jeu=localStorage.getItem("tide_jeu")==="plus"?"plus":"classic";
const maj=()=>{document.getElementById("cC").setAttribute("aria-pressed",jeu==="classic");
               document.getElementById("cP").setAttribute("aria-pressed",jeu==="plus")};
document.getElementById("cC").onclick=()=>{jeu="classic";localStorage.setItem("tide_jeu",jeu);maj()};
document.getElementById("cP").onclick=()=>{jeu="plus";localStorage.setItem("tide_jeu",jeu);maj()};
maj();
const aller=m=>location.href=(jeu==="plus"?"plus.html":"classic.html")+"?m="+m;
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>aller(b.dataset.m));
document.getElementById("reg").onclick=()=>aller("regles");
