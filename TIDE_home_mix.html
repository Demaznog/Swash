<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIDE — Home Mix</title>
<style>
:root{
  --ink:#173b40;
  --ink2:#0d4660;
  --pill:#0e4b68;
  --corail:#E05638;
  --sand:#F8D8AB;
  --sand2:#F3D4A4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Nunito,ui-rounded,-apple-system-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--sand);color:var(--ink)}
body{min-height:100svh}
.sea{
  position:absolute;inset:0 0 auto;height:235px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,#1598ba 0,#43bcd0 46%,#a8dcd2 72%,#e9ddbd 89%,var(--sand) 100%)
}
.page{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 26px)}

.brand{text-align:center}
.logo{width:min(205px,52vw);display:block;margin:0 auto 7px}
.punch{font-size:clamp(19px,5.2vw,23px);font-weight:900;text-align:center;line-height:1.02;color:var(--ink2)}
.punch em{display:block;font-style:normal;font-size:.56em;color:var(--corail);margin-top:6px;letter-spacing:.02em}

.section-label{margin:24px 0 10px;text-align:center;font-size:9px;font-weight:900;letter-spacing:.18em;color:var(--ink2);opacity:.48}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  border:0;background:rgba(255,244,225,.34);padding:8px 8px 12px;border-radius:22px;color:var(--ink);
  position:relative;transition:.22s transform,.22s box-shadow,.22s background
}
.card[aria-pressed="true"]{
  background:rgba(255,255,255,.48);
  box-shadow:0 10px 24px rgba(121,85,45,.13), inset 0 0 0 2px rgba(14,75,104,.74);
  transform:translateY(-2px)
}
.card[aria-pressed="true"]::after{
  content:"JOUER";position:absolute;right:12px;top:12px;
  background:var(--corail);color:#fff;padding:5px 8px;border-radius:999px;
  font-size:8px;font-weight:900;letter-spacing:.08em
}
.board{
  width:100%;aspect-ratio:1;background-size:100% 100%;background-repeat:no-repeat;
  filter:drop-shadow(0 7px 11px rgba(135,91,40,.18))
}
.name{font-size:17px;font-weight:900;text-align:center;line-height:1;margin-top:7px}
.meta{font-size:9.5px;font-weight:900;text-align:center;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);opacity:.52;margin-top:4px}

.mode-label{margin:19px 0 8px;text-align:center;font-size:9px;font-weight:900;letter-spacing:.18em;color:var(--ink2);opacity:.48}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mode{
  min-height:72px;border:1px solid rgba(198,154,98,.34);border-radius:17px;background:rgba(243,212,164,.78);
  color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:10px 5px;font-weight:900;font-size:14px
}
.mode small{font-size:9px;font-weight:800;opacity:.56;margin-top:3px;line-height:1.1}
.mode.primary{background:linear-gradient(180deg,#184a55,#113741);color:#fff;border:0;box-shadow:0 8px 20px rgba(20,58,63,.20)}
.mode.primary small{opacity:.72}

.rules{margin-top:16px;text-align:center}
.rules button{border:0;background:none;color:var(--ink);opacity:.64;font:inherit;font-size:13px;font-weight:900;text-decoration:underline;text-underline-offset:4px}

@media(max-width:390px){
  .page{padding-left:14px;padding-right:14px}
  .duo{gap:9px}
  .card{padding:6px 6px 10px}
  .modes{gap:6px}
  .mode{font-size:13px;min-height:68px}
}
</style>
</head>
<body>
<div class="sea"></div>
<main class="page">
  <div class="brand">
    <img class="logo" src="logo.svg" alt="TIDE">
    <div class="punch">Alignez 4 coquillages<em>sans jamais revenir en arrière</em></div>
  </div>

  <div class="section-label">CHOISISSEZ VOTRE TIDE</div>

  <section class="duo">
    <button class="card" aria-pressed="true">
      <div class="board" style="background-image:url('')"></div>
      <div class="name">TIDE Classic</div>
      <div class="meta">4 × 4 · Alignez 4</div>
    </button>

    <button class="card" aria-pressed="false">
      <div class="board" style="background-image:url('')"></div>
      <div class="name">TIDE+</div>
      <div class="meta">5 × 5 · + la Perle</div>
    </button>
  </section>

  <div class="mode-label">COMMENT JOUER ?</div>

  <section class="modes">
    <button class="mode primary">Solo<small>contre l’IA</small></button>
    <button class="mode">À deux<small>même écran</small></button>
    <button class="mode">En ligne<small>contre un joueur</small></button>
  </section>

  <div class="rules"><button>Règles du jeu</button></div>
</main>

<script>
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('click',()=>{
    document.querySelectorAll('.card').forEach(c=>c.setAttribute('aria-pressed','false'));
    card.setAttribute('aria-pressed','true');
  });
});
</script>
</body>
</html>
